<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Loaded in <iframe sandbox="allow-scripts">: an opaque origin with no cookies,
     so student code (and classmates' gallery games) can never touch anyone's account. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net http://localhost:*; connect-src 'self' https://cdn.jsdelivr.net http://localhost:*; style-src 'unsafe-inline'; img-src data: blob:">
<title>PyQuest runner</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b2230; overflow: hidden; color-scheme: dark; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; outline: none; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; font: 600 16px/1.3 system-ui, sans-serif; color: #fff; text-align: center; padding: 20px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c" width="400" height="400" tabindex="0" aria-label="Game screen"></canvas>
<div id="msg">Loading Python…</div>
<script type="module">
import { drawSprite } from "./sprites.js";

const params = new URLSearchParams(location.search);
// Local testing can point at a local copy of Pyodide; production always uses the CDN.
const local = params.get("pyodide");
const PYODIDE = local && /^http:\/\/localhost:\d+\/$/.test(local) ? local : "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
const ORIGIN = location.ancestorOrigins?.[0] || "*";

const cv = document.getElementById("c"), ctx = cv.getContext("2d"), msg = document.getElementById("msg");
let py = null, pq = null, ns = null, raf = 0, running = false, runId = 0;
const send = (m) => parent.postMessage({ src: "pq-runner", ...m }, "*");

// ---------- sound (synthesised, so nothing to download) ----------
let ac = null;
const audio = () => { try { ac ||= new AudioContext(); if (ac.state === "suspended") ac.resume(); } catch {} return ac; };
function tone(f1, f2, dur, type = "square", vol = 0.08, delay = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.12) {
  const a = audio(); if (!a) return;
  const b = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = a.createBufferSource(), g = a.createGain(); g.gain.value = vol;
  s.buffer = b; s.connect(g).connect(a.destination); s.start();
}
const SFX = {
  coin: () => { tone(988, 988, 0.07); tone(1319, 1319, 0.12, "square", 0.08, 0.07); },
  jump: () => tone(300, 700, 0.15), zap: () => tone(1200, 200, 0.18, "sawtooth", 0.06),
  hurt: () => tone(300, 90, 0.25, "triangle", 0.12), boom: () => noise(0.35),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.12, "square", 0.07, i * 0.1)),
};
const TUNES = { chill: [262, 330, 392, 330, 294, 349, 440, 349], fast: [392, 392, 523, 392, 466, 440, 392, 349] };
let tune = null, tuneTimer = 0, tuneStep = 0;
function setMusic(name) {
  if (name === tune) return;
  tune = name; clearInterval(tuneTimer);
  if (!TUNES[name]) return;
  tuneTimer = setInterval(() => { const n = TUNES[tune]; if (n) tone(n[tuneStep++ % n.length], n[tuneStep % n.length], 0.2, "triangle", 0.035); }, name === "fast" ? 180 : 320);
}

// ---------- keys ----------
const KEYMAP = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", " ": "space", a: "left", d: "right", w: "up", s: "down" };
const held = new Set();
function setKey(k, down) {
  if (!pq || !k) return;
  const keys = pq._keys;
  if (down) { keys.add(k); pq.tap(k); } else keys.discard(k);
}
addEventListener("keydown", (e) => { if (KEYMAP[e.key]) { e.preventDefault(); if (!e.repeat) setKey(KEYMAP[e.key], true); } });
addEventListener("keyup", (e) => setKey(KEYMAP[e.key], false));
addEventListener("pointerdown", () => { audio(); cv.focus(); });

// ---------- drawing ----------
function draw(f) {
  ctx.fillStyle = f.bg || "#0b2230"; ctx.fillRect(0, 0, 400, 400);
  for (const t of f.things || []) {
    if (t[0] === "b") {
      const [, x, y, w, h, color] = t;
      ctx.fillStyle = /^#[0-9a-f]{3,8}$|^[a-z]{3,20}$/i.test(color) ? color : "#ffffff";
      ctx.fillRect(Math.round(x - w / 2), Math.round(y - h / 2), Math.round(w), Math.round(h));
      ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.fillRect(Math.round(x - w / 2), Math.round(y - h / 2), Math.round(w), 3);
    } else drawSprite(ctx, t[1], t[2], t[3], 32 * (t[4] || 1));
  }
  for (const [t, x, y, size, color] of f.texts) {
    ctx.font = `700 ${Math.max(8, Math.min(64, size))}px system-ui, sans-serif`;
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillText(t, x + 2, y + 2);
    ctx.fillStyle = color; ctx.fillText(t, x, y);
  }
  if (f.over) {
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 150, 400, 100);
    ctx.font = "800 30px system-ui, sans-serif"; ctx.fillStyle = "#fff"; ctx.textAlign = "center";
    ctx.fillText(f.over, 200, 210); ctx.textAlign = "start";
  }
}

function stop(reason = "stopped") {
  running = false; cancelAnimationFrame(raf); setMusic(null);
  if (pq) pq._keys.clear();
  send({ type: "stopped", reason });
}

function loop(id) {
  if (!running || id !== runId) return;
  const f = JSON.parse(pq.frame(ns));
  draw(f);
  for (const s of f.sounds) SFX[s]?.();
  setMusic(f.music);
  if (f.out.length) send({ type: "print", lines: f.out });
  if (f.error) { send({ type: "error", ...f.error, during: "update" }); return stop("error"); }
  if (f.over) { SFX.win(); send({ type: "gameover", text: f.over }); return stop("over"); }
  raf = requestAnimationFrame(() => loop(id));
}

// ---------- commands from the app ----------
async function boot() {
  try {
    const { loadPyodide } = await import(PYODIDE + "pyodide.mjs");
    py = await loadPyodide({ indexURL: PYODIDE });
    const src = await (await fetch("./pq.py")).text();
    py.FS.writeFile("/home/pyodide/pq.py", src);
    py.runPython("import sys\nif '/home/pyodide' not in sys.path: sys.path.insert(0, '/home/pyodide')");
    pq = py.pyimport("pq");
    msg.textContent = "";
    draw({ bg: "#0b2230", things: [], texts: [] });
    send({ type: "ready" });
  } catch (e) {
    msg.textContent = "Python didn't load. Check your internet and reload.";
    send({ type: "fatal", message: String(e) });
  }
}

addEventListener("message", (e) => {
  if (e.source !== parent) return;
  const m = e.data || {};
  if (!pq) return;
  if (m.lang) pq.set_lang(m.lang);
  if (m.type === "key") return setKey(m.key, m.down);
  if (m.type === "stop") return stop();
  if (m.type === "snapshot") {
    // A still picture of a game after about a second of play, for the teacher's All work screen. No sound.
    if (running) stop("restart");
    runId++;
    ns = pq.new_namespace();
    const err = pq.run(String(m.code || ""), ns)?.toJs({ dict_converter: Object.fromEntries });
    let f = JSON.parse(pq.snapshot());
    if (!err) for (let i = 0; i < 60; i++) { f = JSON.parse(pq.frame(ns)); if (f.error || f.over) break; }
    draw(f);
    return send({ type: "snap", id: m.id, image: cv.toDataURL("image/png"), error: err || f.error || null });
  }
  if (m.type === "run" || m.type === "check") {
    if (running) stop("restart");
    runId++;
    ns = pq.new_namespace();
    const err = pq.run(String(m.code || ""), ns)?.toJs({ dict_converter: Object.fromEntries });
    const printed = pq._out.toJs();
    if (printed.length) send({ type: "print", lines: printed });
    if (err) { draw(JSON.parse(pq.snapshot())); send({ type: "error", id: m.id, ...err, during: "run" }); return; }
    if (m.type === "check") {
      const r = pq.check(String(m.check || "result = None"), ns).toJs({ dict_converter: Object.fromEntries });
      draw(JSON.parse(pq.snapshot()));   // show the scene without moving it
      return send({ type: "checked", id: m.id, ...r });
    }
    running = true; send({ type: "started", id: m.id }); cv.focus({ preventScroll: true });
    loop(runId);
  }
});

boot();
</script>
</body>
</html>
