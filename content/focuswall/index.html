<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Focus Wall</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800;900&family=Barlow:wght@500;600;700&family=Space+Grotesk:wght@600;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
  :root{
    /* Raven Racing palette */
    --bg:#031a3e; --panel:#0a2a5c; --panel2:#123a78; --line:#24508f;
    --text:#ffffff; --muted:#c9d4e6; --accent:#2fae63; --accent-soft:rgba(47,174,99,.16);
    --green:#14743f; --yellow:#ffc928; --danger:#e0262e;
    --display:"Saira Condensed","Arial Narrow",Impact,sans-serif; --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif; --radius:1.125rem;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(75rem 44rem at 85% 10%, var(--glow), transparent 60%), linear-gradient(160deg,var(--bgA),var(--bgB) 55%);
    color:var(--text); font-family:var(--body);
    font-size:1.375rem; line-height:1.3; display:flex; flex-direction:column; height:100vh; overflow:hidden;
    transition:background .4s;
  }
  button{font:inherit;color:inherit;cursor:pointer}

  /* ---------- Top bar ---------- */
  header{display:flex;align-items:center;gap:1.125rem;padding:0.5rem 1.25rem;background:var(--headbg);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;flex-direction:column}
  .brand .title{font-size:1.75rem;font-weight:800;letter-spacing:.0.3125rem}
  .brand .sub{font-size:1.125rem;color:var(--muted)}
  .clock{flex:none;text-align:right;padding-left:0.375rem;border-left:1px solid var(--line);padding-left:1rem}
  .clock .time{font-size:2.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .clock .date{font-size:1.125rem;color:var(--muted)}

  .timer{display:flex;align-items:center;gap:0.625rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0.5rem 0.75rem}
  .timer .readout{font-size:2.75rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:9.375rem;text-align:center;color:var(--accent);line-height:1}
  .timer .readout.done{animation:flash 1s steps(2) infinite;color:var(--danger)}
  .timer .grp{display:flex;flex-wrap:nowrap;gap:0.375rem}
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:0.625rem;padding:0.625rem 1rem;font-size:1.188rem;font-weight:700;min-height:3rem;touch-action:manipulation;user-select:none}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
  .btn.on{background:var(--accent-soft);border-color:var(--accent)}
  @keyframes flash{50%{opacity:.25}}

  /* ---------- Tabs ---------- */
  nav{display:flex;align-items:center;gap:1rem;padding:0.625rem 1.25rem;background:var(--navbg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  nav .tabs{flex:1;display:flex;gap:0.375rem;min-width:0}
  body.preview nav .tabs, body.preview .navtools{display:none}
  #pvBtn[hidden], #buildBtn[hidden]{display:none}
  .pvbar{flex:1;display:flex;align-items:center;gap:0.4rem;min-width:0;border:3px solid var(--yellow);border-radius:0.75rem;padding:0.3rem 0.6rem;background:rgba(255,200,40,.08)}
  .pvbar[hidden]{display:none}
  .pvbar .pvlab{font-weight:900;color:var(--yellow);letter-spacing:.06em;font-size:1rem;white-space:nowrap}
  .pvbar .pvwhen{display:flex;flex-direction:column;line-height:1.1;margin-right:auto;padding:0 0.4rem;min-width:0}
  .pvbar .pvwhen b{font-family:var(--display);font-size:1.2rem;white-space:nowrap}
  .pvbar .pvdrow{display:flex;align-items:center;gap:0.3rem}
  .pvbar .pvdrow{position:relative}
  .pvbar .btn.pvcal{min-height:2.75rem;min-width:2.75rem;padding:0 0.45rem;font-size:1.2rem;border-color:var(--yellow)}
  .pvbar #pvPick{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;color-scheme:dark}
  .pvbar .pvwhen small{font-size:0.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pvbar .pvgrp{display:flex;align-items:center;gap:0.3rem;padding:0.15rem 0.4rem;border:2px solid var(--accent);border-radius:0.6rem;margin-right:0.4rem}
  .pvbar .pvgrp small{font-size:0.7rem;font-weight:900;color:var(--accent);letter-spacing:.05em;line-height:1;text-align:center}
  .pvbar .btn:disabled{opacity:.4}
  .pvbar .btn{white-space:nowrap;min-height:2.75rem;padding-left:0.7rem;padding-right:0.7rem}
  .pvbar .pvexit{background:var(--yellow);color:#1b1b1b;border-color:var(--yellow)}
  body.preview #clockTime{color:var(--yellow)}
  nav button{touch-action:manipulation;user-select:none;
    background:var(--panel);border:2px solid var(--line);border-radius:0.875rem;
    padding:0.75rem 0.75rem 0.625rem;text-align:left;position:relative;overflow:hidden;white-space:nowrap;display:flex;align-items:baseline;gap:0.5rem;min-width:0
  }
  nav button::before{content:"";position:absolute;left:0;top:0;right:0;height:0.375rem;background:var(--c)}
  nav button .per{flex:none;font-size:1.062rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px}
  nav button .tm{margin-left:auto;flex:none;font-size:0.875rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  nav button.now .tm{color:var(--c)}
  nav button.now .tm::before{content:'● ';animation:flash 1.6s steps(2) infinite}
  .gchip{font-size:1rem;font-weight:800;padding:0.25rem 0.625rem;border-radius:999px;background:var(--accent);color:var(--onaccent);white-space:nowrap}
  @keyframes passpulse{0%,100%{box-shadow:0 0 0 0 rgba(224,38,46,.7)}50%{box-shadow:0 0 0 0.6rem rgba(224,38,46,0)}}
  .nopass{flex:none;display:flex;align-items:center;gap:0.5rem;background:#e0262e;color:#fff;font-family:var(--display);font-weight:800;font-size:1.75rem;
    padding:0.375rem 1.125rem;border-radius:0.75rem;white-space:nowrap;letter-spacing:.02em;animation:passpulse 2s infinite}
  .nopass small{font-size:1.125rem;font-weight:700;opacity:.9}
  .nopass[hidden]{display:none}
  .navtools{flex:none;display:flex;gap:0.375rem}
  nav .tabs button{flex:1 1 auto;gap:0.5rem}
  nav .tabs button .nm{flex:none}
  .navtools .btn{font-size:1rem;padding:0.5rem 0.625rem;min-height:3rem}
  nav .navtools button::before{display:none}
  .soon{flex:none;font-size:1.125rem;font-weight:700;padding:0.375rem 0.875rem;border-radius:0.75rem;border:2px solid var(--yellow);color:var(--text);white-space:nowrap}
  .soon b{color:var(--yellow)}
  .soon[hidden]{display:none}
  .daynote{margin-top:0.625rem;background:var(--yellow);color:#1b1b1b;border-radius:var(--radius);padding:0.75rem 1.25rem;font-family:var(--display);font-weight:800;font-size:2rem;text-align:center}
  .daynote small{display:block;font-family:var(--body);font-size:1.25rem;font-weight:700}
  .daynote[hidden]{display:none}
  .dayBadge{flex:none;font-size:1.125rem;font-weight:800;padding:0.25rem 0.75rem;border-radius:999px;border:2px solid var(--accent);color:var(--accent);white-space:nowrap}
  .dayBadge[hidden]{display:none}
  .nextInfo{flex:none;font-size:0.9375rem;color:var(--muted);white-space:nowrap;align-items:center}
  body.teacher .periodbar{flex-wrap:wrap;row-gap:0.5rem}
  body.teacher .periodbar .lesson{min-width:28rem}
  ul.check li.paused{opacity:.45}
  ul.check li.paused .itxt::after{content:'  (journal — starts Jan 5)';font-size:.8em;color:var(--muted);font-style:italic}
.strip{flex:none;display:flex;gap:0.875rem;margin-top:0.75rem}
  .strip[hidden]{display:none}
  .strip > div{flex:1;min-width:0;height:5.25rem;overflow:hidden;align-content:flex-start;background:var(--panel);border:1px solid var(--line);border-left:0.375rem solid var(--accent);border-radius:0.875rem;padding:0.5rem 1rem;font-size:1.25rem;line-height:1.3;display:flex;flex-wrap:wrap;align-items:baseline;gap:0.25rem 0.625rem}
  .strip .lab{flex-basis:100%;font-family:var(--display);font-weight:800;font-size:0.95rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  .strip .qt{font-style:italic;font-weight:600}
  .strip .by{color:var(--muted);font-weight:700;white-space:nowrap}
  .strip .ht b{color:var(--accent);margin-right:0.25rem}
  .strip .qt,.strip .ht{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .strip .sq{flex-wrap:wrap}
  .strip.fresh > div{animation:stripIn .8s ease}
  @keyframes stripIn{from{opacity:0;transform:translateY(.3rem)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.strip.fresh > div{animation:none}}
.lessonbar{flex:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:0.75rem;margin:-0.25rem 0 0.75rem;height:6.2rem}
  .lessonbar[hidden]{display:none}
  .lessonbar > div{min-width:0;border-radius:var(--radius);padding:0.4rem 1rem;justify-content:center;background:var(--panel);border:2px solid var(--line, rgba(255,255,255,.12));display:flex;flex-direction:column;gap:0.15rem;overflow:hidden}
  .lessonbar .lb-next{border-color:var(--accent);background:linear-gradient(90deg,rgba(255,255,255,.04),transparent)}
  .lessonbar .lb-tag{font-size:0.875rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);white-space:nowrap}
  .lessonbar .lb-tag b{color:var(--text)}
  .lessonbar p{margin:0;font-size:1.25rem;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .lessonbar .lb-next p b{color:var(--accent)}
.racebar{flex:none;display:flex;align-items:center;gap:1.25rem;margin:-0.25rem 0 0.75rem;padding:0.5rem 1.25rem;border-radius:var(--radius);
    background:linear-gradient(90deg,rgba(20,116,63,.35),rgba(3,26,62,.2));border:2px solid var(--accent);position:relative;overflow:hidden}
  .racebar[hidden]{display:none}
  .racebar::before{content:"";position:absolute;right:0;top:0;bottom:0;width:6rem;opacity:.35;
    background:conic-gradient(#fff 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/1rem 1rem}
  .racebar .flag{font-size:2rem}
  .racebar .big{font-family:var(--display);font-style:italic;font-weight:900;font-size:2.75rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
  .racebar .unit{font-family:var(--display);font-weight:800;font-size:1.25rem;text-transform:uppercase;letter-spacing:.06em;line-height:1.1}
  .racebar .sub{font-size:1.0625rem;color:var(--muted);line-height:1.3}
  .racebar .sub b{color:var(--text)}
  .racebar .track{flex:1;min-width:8rem;height:0.75rem;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-right:6rem}
  .racebar .track{position:relative;overflow:visible}
  .racebar .track i{display:block;height:100%;background:var(--accent);border-radius:999px}
  .racebar .track .mk{position:absolute;top:-0.35rem;width:0.25rem;height:1.45rem;background:#fff;border-radius:2px;transform:translateX(-50%)}
  .racebar .track .mk.pres{background:var(--yellow)}
  .racebar .mile{flex:none;font-size:1rem;line-height:1.25;padding:0.3rem 0.75rem;border-radius:0.75rem;border:2px solid var(--yellow);color:var(--text);white-space:nowrap}
  .racebar .mile b{color:var(--yellow)}
  .racebar .mile .lateln{font-size:.9em;font-weight:700;color:var(--muted)}
  .racebar .mile.now .lateln{color:#1b1b1b}
  .racebar .mile{line-height:1.2;padding-top:0.2rem;padding-bottom:0.2rem}
  .racebar .mile.now{background:var(--yellow);color:#1b1b1b}.racebar .mile.now b{color:#1b1b1b}
  .racebar .mile.done{border-color:var(--line);color:var(--muted)}.racebar .mile.done b{color:var(--muted)}
#buildBtn{flex:none;font-size:1.0625rem;padding:0.4rem 0.8rem;border-color:var(--accent)}
  #buildBtn[hidden]{display:none}
  .signoff .signtag{font-weight:800;font-size:.85em;color:var(--muted);margin:-0.3em 0 0.35em;text-transform:uppercase;letter-spacing:.05em}
  .sgrid{display:grid;gap:0.25em 0.35em;align-items:center}
  .sgrid .sh{font-size:.85em;text-align:center;line-height:1.05}
  .sgrid .sh b{display:block;color:var(--accent);font-family:var(--display);font-size:1.05em}
  .sgrid .sh small{color:var(--muted);font-weight:700}
  .sgrid .sitem{font-size:.92em;line-height:1.2;padding:0.15em 0.4em;background:var(--panel2);border-radius:0.4em;min-height:1.9em;display:flex;align-items:center}
  .sgrid .scell{justify-self:center;width:1.9em;height:1.9em;border:3px solid var(--accent);border-radius:0.35em;cursor:pointer;display:grid;place-items:center;font-weight:900;color:var(--onaccent);touch-action:manipulation}
  .sgrid .scell.done{background:var(--accent)}
  .sgrid .scell.done::after{content:"✓"}
  .sbars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0.4em 0.75em;margin-top:auto;padding-top:0.5em}
  .sbar{display:flex;align-items:center;gap:0.35em;font-size:.85em}
  .sbar b{color:var(--accent);font-family:var(--display)}
  .sbar span{flex:1;height:0.55em;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}
  .sbar i{display:block;height:100%;background:var(--accent)}
  .sbar em{font-style:normal;font-weight:800;color:var(--muted)}
  .bo-prog{gap:0.5rem}
  .bo-car{font-size:1.0625rem}
  .bo-car.on,.bo-car.on b{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
  .buildov{position:fixed;inset:0;z-index:50;background:rgba(2,10,24,.86);display:flex;align-items:center;justify-content:center;padding:1.25rem}
  .buildov[hidden]{display:none}
  .bo-panel{width:100%;height:100%;background:var(--bgB);border:2px solid var(--accent);border-radius:var(--radius);display:flex;flex-direction:column;padding:0.875rem 1.25rem;overflow:hidden}
  .bo-head{display:flex;align-items:center;gap:1.25rem;margin-bottom:0.625rem}
  .bo-head h2{margin:0;font-family:var(--display);font-style:italic;text-transform:uppercase;font-size:2rem;color:var(--text)}
  .bo-prog{flex:1;display:flex;align-items:center;gap:0.75rem;font-size:1.25rem;color:var(--muted)}
  .bo-prog b{color:var(--accent)}
  .bo-bar{flex:1;height:0.75rem;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
  .bo-bar i{display:block;height:100%;background:var(--accent)}
  .bo-body{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0.75rem}
  .bo-unit{min-height:0;display:flex;flex-direction:column;gap:0.5rem;overflow-y:auto;touch-action:pan-y;scrollbar-width:thin}
  .bo-unit h3{margin:0;font-family:var(--display);font-size:1.0625rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
  .bo-step{background:var(--panel);border:1px solid var(--line);border-radius:0.75rem;padding:0.4rem 0.6rem}
  .bo-step.ok{border-color:var(--accent)}
  .bo-top{display:flex;justify-content:space-between;gap:0.5rem;font-size:0.95rem;margin-bottom:0.2rem}
  .bo-items{display:flex;flex-direction:column;gap:0.1rem}
  .bo-item{display:flex;gap:0.4rem;align-items:flex-start;font-size:0.8rem;line-height:1.2;cursor:pointer;padding:0.15rem 0}
  .bo-item.done span:last-child{color:var(--muted);text-decoration:line-through}
  .bo-box{flex:none;width:1.05rem;height:1.05rem;border:2px solid var(--accent);border-radius:0.25rem;display:grid;place-items:center;font-size:.75rem;font-weight:900;color:var(--onaccent)}
  .bo-item.done .bo-box{background:var(--accent)}
  nav button .nm{min-width:0;font-size:1.375rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav button.active{background:var(--panel2);border-color:var(--c);box-shadow:0 0 1.5rem -0.5rem var(--c)}
  nav button.active .per{color:var(--c)}

  /* ---------- Main ---------- */
  main{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 1.25rem 0.875rem}
  .periodbar{display:flex;align-items:center;gap:0.875rem;flex-wrap:nowrap;background:var(--panel2);border:2px solid var(--accent);border-radius:var(--radius);padding:0.625rem 1.125rem;margin:0.625rem 0}
  .periodbar h1{margin:0;font-size:2.125rem;font-weight:900;white-space:nowrap}
  .periodbar .lesson{font-size:1.5rem;color:var(--accent);font-weight:700;flex:1;min-width:0}
  .chip{font-size:1rem;font-weight:800;padding:0.25rem 0.625rem;border-radius:62.44rem;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);letter-spacing:1px}

  .grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:0.875rem;min-height:0}
  .card{font-size:1.375rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0.875rem 1.125rem;display:flex;flex-direction:column;min-height:0;overflow:auto;position:relative}
  .card h2{margin:0 0 0.4545em;font-size:1.182em;font-weight:900;display:flex;align-items:center;gap:0.4545em}
  .card h2 .num{display:inline-grid;place-items:center;width:1.545em;height:1.545em;border-radius:0.4545em;background:var(--accent);color:var(--onaccent);font-size:0.9091em;flex:none}
  .card h3{margin:0.4545em 0 0.1818em;font-size:0.8636em;color:var(--accent);text-transform:uppercase;letter-spacing:1px}
  .big{font-size:1.182em;font-weight:700}
  .txt{white-space:pre-wrap;outline:none;border-radius:0.3636em}

  ul.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0.2727em}
  ul.check li{display:flex;align-items:flex-start;gap:0.5455em;padding:0.2727em 0.3636em;border-radius:0.4545em;background:var(--panel2)}
  ul.check li .box{flex:none;width:1.636em;height:1.636em;font-size:1.091em;touch-action:manipulation;border-radius:0.3636em;border:3px solid var(--accent);display:grid;place-items:center;margin-top:2px;cursor:pointer;font-weight:900;color:var(--onaccent)}
  ul.check li.done .box{background:var(--accent)}
  ul.check li.done .box::after{content:"✓"}
  ul.check li.done .itxt{text-decoration:line-through;color:var(--muted)}
  ul.check li .itxt{flex:1;outline:none;white-space:pre-wrap}
  ul.check li .del{display:none;background:none;border:none;color:var(--danger);font-size:1em;padding:0 0.1818em}
  .agenda li .tm{flex:none;font-weight:800;color:var(--accent);min-width:2.909em;outline:none}

  ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:0.2727em}
  ol.steps li{counter-increment:s;display:flex;gap:0.5455em;align-items:flex-start;background:var(--panel2);padding:0.2727em 0.4545em;border-radius:0.4545em}
  ol.steps li::before{content:counter(s);flex:none;width:1.364em;height:1.364em;border-radius:50%;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;font-weight:900}
  ol.steps li .itxt{flex:1;outline:none;white-space:pre-wrap}
  ol.steps li .del{display:none;background:none;border:none;color:var(--danger);font-size:1em}
  .hand{margin-top:0.3636em;font-weight:800;font-size:0.9091em}
  .challenge{margin-top:0.4545em;border:2px dashed var(--accent);border-radius:0.6364em;padding:0.4545em 0.6364em;background:var(--accent-soft)}
  .challenge h3{margin-top:0}

  dl.vocab{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0.2727em 0.6364em;align-items:baseline}
  dl.vocab dt{font-family:"JetBrains Mono",Consolas,Menlo,monospace;font-weight:800;color:var(--accent);background:var(--panel2);padding:2px 0.3636em;border-radius:0.3636em;outline:none;white-space:pre-wrap}
  dl.vocab dd{margin:0;outline:none;white-space:pre-wrap;display:flex;gap:0.3636em}
  dl.vocab dd span{flex:1;outline:none}
  dl.vocab .del{display:none;background:none;border:none;color:var(--danger);font-size:1em}

  .addrow{display:none;margin-top:0.3636em;align-self:flex-start}
  .cardtools{position:absolute;top:0.5455em;right:0.6364em;display:flex;gap:0.2727em}
  .cardtools .btn{font-size:0.6818em;padding:0.1818em 0.4545em}
  .tonly{display:none !important}

  /* ---------- Teacher mode ---------- */

  if(!state.pacing) state.pacing=clone(DEFAULT_PACING);

  const dayNo=k=>1+schoolDaysAfter(start,k);                // school-day number (start = day 1)
  const extra=i=>seg.extra[lib[i].id]||0;
  const out={}; let cursor=0, group=[];
  // Group 1: every lesson up to the Team Presentation is stretched or squeezed to fill the days before it,
  //          and the presentation lands exactly on its date.
  // Group 2: the remaining lessons use the curriculum's days, squeezed if needed to finish by the deadline.
  // Extra days you add (+1 Day) are kept on top; the other lessons in the group adjust around them.
  const flush=(deadlineKey, pinned)=>{
    if(!group.length) return;
    const pin = pinned ? group.pop() : null;
    const dl = dayNo(deadlineKey) - (pin!==null ? 1 : 0);      // last day available before the pinned day
    const flex=group.filter(i=>!lib[i].fixed), locked=group.filter(i=>lib[i].fixed);
    locked.forEach(i=>out[i]=lib[i].days);
    const fixed=group.reduce((a,i)=>a+extra(i),0)+locked.reduce((a,i)=>a+lib[i].days,0), W=flex.reduce((a,i)=>a+lib[i].days,0);
    const avail=dl-cursor-fixed;
    if(pin!==null || W>avail) shareDays(lib, flex, Math.max(flex.length, avail), out);
    else flex.forEach(i=>out[i]=lib[i].days);
    group.forEach(i=>out[i]+=extra(i));
    cursor+=group.reduce((a,i)=>a+out[i],0);
    if(pin!==null){ out[pin]=1+extra(pin); cursor+=out[pin]; }
    group=[];
  };
  for(let i=idx;i<lib.length;i++){
    if(!(lib[i].days>0)) continue;
    group.push(i);
    if(lib[i].pin==='presentation') flush(PRESENTATION_DAY, true);
  }
  flush(seg.deadline, false);
  for(let i=idx;i<lib.length;i++) if(!(i in out)) out[i]=9999;          // Race Prep: stays until the race
  fitCache[key]=out; return out;
}
function nextLessonDate(pid, dKey){        // first later school day that shows a different lesson
  const cur=lessonFor(pid,dKey); if(!cur) return null; const d=kdate(dKey);
  for(let i=0;i<120;i++){ d.setDate(d.getDate()+1); if(!isSchoolDay(d)) continue;
    const nx=lessonFor(pid,dkey(d)); if(nx && nx.lesson.id!==cur.lesson.id) return {date:new Date(d), lesson:nx.lesson}; }
  return null;
}
let lastSync='';
function syncLessons(rerender, force){       // put the scheduled lesson on the board (keeps your edits per lesson)
  const today=dkey(NOW()); if(!force && today===lastSync) return; lastSync=today;
  let changed=false;
  for(const pid in LESSONS){
    const cur=lessonFor(pid,today); if(!cur) continue;
    const board=state.periods[pid];
    if(board._lid===cur.lesson.id) continue;
    state.lessonEdits[pid]=state.lessonEdits[pid]||{};
    if(board._lid) state.lessonEdits[pid][board._lid]=clone(board);
    const saved=state.lessonEdits[pid][cur.lesson.id];
    state.periods[pid]=Object.assign(clone(saved||cur.lesson.data), {_lid:cur.lesson.id});
    changed=true;
  }
  if(changed){ save(false); if(rerender) render(); }
}
function changeExtra(pid, delta){
  const today=dkey(NOW()), cur=lessonFor(pid,today); if(!cur) return;
  const e=cur.seg.extra, id=cur.lesson.id;
  e[id]=Math.max(0,(e[id]||0)+delta); if(!e[id]) delete e[id];
  save(); syncLessons(false,true); render();
}

const JOURNAL_PAUSED = ['p2','p3','p4','p7'];

const CARS=['671','672','673','674'];
function buildState(car, lid, n){
  state.buildChecks=state.buildChecks||{}; const c=state.buildChecks[car]=state.buildChecks[car]||{};
  const a=c[lid]=c[lid]||[]; while(a.length<n) a.push(false); return a; }
function carProgress(car){ let done=0,total=0; for(const l of LESSONS.p1) if(l.build){ const n=l.build.items.length, a=buildState(car,l.id,n); total+=n; done+=a.slice(0,n).filter(Boolean).length; } return {done,total,pct:Math.round(100*done/Math.max(1,total))}; }
function stepFor(lid){                       // this lesson's build step, or the next one coming up
  const lib=LESSONS.p1, i=Math.max(0, lib.findIndex(l=>l.id===lid));
  if(lib[i] && lib[i].build) return {l:lib[i], when:'today'};
  for(let j=i+1;j<lib.length;j++) if(lib[j].build) return {l:lib[j], when:'next'};
  for(let j=lib.length-1;j>=0;j--) if(lib[j].build) return {l:lib[j], when:'last'};

/* ---------- Bell schedule ---------- */
function hm(m){ const h=Math.floor(m/60), mm=String(m%60).padStart(2,'0'); return ((h+11)%12+1)+':'+mm; }
let nowId=null, lastAuto=null, autoOn=true;
function schoolStatus(now){
  if(closedInfo(now)) return null;          // weekends, holidays, breaks, summer, remote days: no bell schedule
  const t=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  for(const p of PERIODS) for(const [a,b] of blocksFor(p)) if(t>=a && t<b) return {p, in:true, start:a, end:b, left:Math.ceil(b-t)};
  let next=null;
  for(const p of PERIODS) for(const [a] of blocksFor(p)) if(a>t && (!next||a<next.start)) next={p,start:a};
  if(next) return {p:next.p, in:false, start:next.start, homeroom:t>=435 && t<465};
  return {p:PERIODS[PERIODS.length-1], in:false, over:true};
}
function lbl(p,start){ return p.id==='p5' ? (start===blocksFor(p)[0][0]?'Period 5':'Period 6') : p.per; }
function tick(){
  const now=NOW();
  $('#clockTime').textContent=now.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  const st=schoolStatus(now);
  let line=now.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
  if(st && st.in) line=`${lbl(st.p,st.start)} · ${st.left} min left`;
  else if(st && st.extra) line=`${st.extra} · ${st.left} min left`;
  else if(st && !st.over && st.start-(now.getHours()*60+now.getMinutes())<=60) line=(st.homeroom?'Homeroom · ':'')+`Next: ${lbl(st.p,st.start)} at ${hm(st.start)}`;
  const closed=closedInfo(now);
  if(closed && closed.kind!=='weekend') line=(closed.kind==='remote'?'💻 ':'🏖 ')+closed.label;
  $('#clockDate').textContent=line;
  const dn=$('#dayNote');
  const dnWas=dn?dn.hidden:true;
  if(dn){
    if(closed && closed.kind!=='weekend' && closed.label!=='Summer Break'){
      const back=nextSchoolDay(now);
      dn.innerHTML=(closed.kind==='remote' ? `💻 ${closed.label} — students are learning from home` : `🏖 No school today — ${closed.label}`)
        + (back && closed.kind!=='remote' ? `<small>Classes resume ${shortDate(back)}</small>` : '');
      dn.hidden=false;
    } else dn.hidden=true;
  }
  if(dn && dn.hidden!==dnWas && typeof fitCards==='function') requestAnimationFrame(fitCards);
  // No passes: first and last 10 minutes of each teaching class
  const np=$('#noPass');
  if(np){
    let show=false, msg='';
    if(st && st.in && st.p.type==='teach'){
      const t=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
      const sinceStart=t-st.start, toEnd=st.end-t;
      if(sinceStart<10){ show=true; msg=`<small>passes in ${Math.ceil(10-sinceStart)} min</small>`; }
      else if(toEnd<=10){ show=true; msg=`<small>until the bell</small>`; }
    }
    np.hidden=!show;
    if(show) np.innerHTML='🚫 NO PASSES '+msg;
    const sn=$('#soon'), up=upcoming(now, state.active);
    if(sn){
      const td=todayItem(now, state.active);
      if(td && !show){
        sn.innerHTML=`${td.kind==='test'?'📝':'📅'} Today: <b>${td.label}</b>`+(td.e?` · ${fmtRange(td)}`:''); sn.hidden=false;
      } else if(up && !show){
        const when = up.days===1 ? 'tomorrow' : `in ${up.days} days`;
        sn.innerHTML=`${up.c.kind==='test'?'📝':'📅'} <b>${up.c.label}</b> · ${fmtRange(up.c)} (${when})`; sn.hidden=false;
      } else sn.hidden=true;
    }
  }
  const newNow = st && st.in ? st.p.id : null;
  if(!state) return;
  { const lb=$('#lessonBar'); if(lb && !lb.hidden){ const c=lessonFor(state.active,dkey(now)); if(lb.dataset.key!==dkey(now)+':'+state.active+':'+(c?c.lesson.id:'')){ renderLessonBar(state.active); fitCards(); } } }
  { const rb=$('#raceBar'); if(rb && state.active==='p1'){ if(rb.dataset.key!==raceKey(now)){ renderRaceBar('p1'); fitCards(); } } }
  { const st=$('#strip'); if(st && !st.hidden && st.dataset.key!==dkey(now)+':'+stripSlot(now)+':'+state.active) renderStrip(state.active); }
  syncLessons(true);
  let needRender = newNow!==nowId; nowId=newNow;
  // auto-follow: switch when the scheduled period changes (manual picks stick until the next bell)
  const target = st ? st.p.id : null;
  if(previewOffset){ if(Date.now()-lastTouch>180000) exitPreview(); else { if(state.active!=='p1'){ state.active='p1'; render(); } return; } }
  if(autoOn && target && !teacher && state.active!==target && manualPick && Date.now()-lastTouch>180000){ manualPick=0; lastAuto=null; }
  if(autoOn && target && target!==lastAuto && !teacher){ lastAuto=target; if(state.active!==target){ state.active=target; save(false); } needRender=true; }
  if(needRender) render();
}
function paintIf(){ const b=$('#ifBtn'), on=ifOn(); b.classList.toggle('on',on); b.style.background=on?'var(--yellow)':''; b.style.color=on?'#1b1b1b':''; b.textContent=on?'📅 IF Day':'📅 IF'; }
$('#ifBtn').onclick=()=>{ try{ if(ifOn()) localStorage.removeItem('focusWall.ifDay'); else localStorage.setItem('focusWall.ifDay', todayKey()); }catch(e){}
  paintIf(); lastAuto=null; render(); tick(); };
paintIf();
$('#autoBtn').onclick=()=>{ autoOn=!autoOn; lastAuto=null; const b=$('#autoBtn'); b.classList.toggle('on',autoOn); b.textContent= autoOn?'⏱ Auto':'⏱ Off'; tick(); };
/* ---------- Preview Days (Period 1 countdown) ---------- */
function pvTo(d){ const t=new Date(d); t.setHours(8,0,0,0);
  if(dkey(t)<FIRST_DAY) { t.setTime(kdate(FIRST_DAY).getTime()); t.setHours(8,0,0,0); } if(dkey(t)>LAST_DAY){ t.setTime(kdate(LAST_DAY).getTime()); t.setHours(8,0,0,0); } previewOffset=t.getTime()-Date.now();
  document.body.classList.add('preview'); $('#pvBar').hidden=false; state.active='p1';
  $('#pvDate').textContent=t.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric', year:'numeric'});
  $('#pvPick').value=dkey(t); syncLessons(false,true); render(); tick(); }
function pvStep(n){ const d=NOW(); const dir=Math.sign(n); let k=Math.abs(n);
  for(let i=0;i<400 && k>0;i++){ d.setDate(d.getDate()+dir); if(isSchoolDay(d)) k--; } pvTo(d); }
function exitPreview(){ previewOffset=0; document.body.classList.remove('preview'); $('#pvBar').hidden=true; lastAuto=null; syncLessons(false,true); render(); tick(); }
$('#pvBtn').onclick=()=>{ if(teacher) $('#teacherBtn').click(); pvTo(NOW()); };
$('#pvExit').onclick=exitPreview;
$('#pvCal').onclick=()=>{ const i=$('#pvPick'); try{ i.showPicker(); }catch(e){ i.focus(); i.click(); } };
$('#pvPick').onchange=e=>{ if(e.target.value) pvTo(kdate(e.target.value)); };
document.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>pvStep(+b.dataset.pv));
document.querySelectorAll('[data-pvgo]').forEach(b=>b.onclick=()=>{ const g=b.dataset.pvgo;
  pvTo(kdate(g==='first'?FIRST_DAY : g==='last'?LAST_DAY : g==='sem2'?SEM2_START : g==='pres'?PRESENTATION_DAY : g==='race'?RACE_DAY : g)); });
setInterval(tick, 1000);

/* =====================================================================
   FULLSCREEN + KEYBOARD SHORTCUTS (1–6 switch tabs, F fullscreen)
   ===================================================================== */
$('#fsBtn').onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };
document.addEventListener('keydown',e=>{
  if(e.target.isContentEditable) return;
  const n=parseInt(e.key,10);
  const vp=visiblePeriods(); if(n>=1 && n<=vp.length){ state.active=vp[n-1].id; save(false); render(); }
  if(e.key==='f'||e.key==='F') $('#fsBtn').click();
});

/* ---------- Fit to any screen (designed at 1920x1080, scales to 4K ViewBoard) ---------- */
let lastW=0;
function scalePage(){
  const ae=document.activeElement, typing=ae && ae.isContentEditable;
  if(typing && innerWidth===lastW){            // only the height changed: the on-screen keyboard opened/closed
    try{ ae.scrollIntoView({block:'center'}); }catch(e){}
    return;
  }
  lastW=innerWidth; window.scrollTo(0,0); document.querySelectorAll('.card').forEach(c=>c.scrollTop=c.scrollTop);
  const k=Math.min(innerWidth/1920, innerHeight/1080);
  document.documentElement.style.fontSize=(16*k)+'px';
  fitCards();
}
function fitCards(){
  document.querySelectorAll('.card').forEach(c=>{
    let f=1; c.style.fontSize='';
    const base=parseFloat(getComputedStyle(c).fontSize);
    while(c.scrollHeight>c.clientHeight+1 && f>0.62){ f-=0.04; c.style.fontSize=(base*f)+'px'; }
  });
}
let fitT; function refit(){ clearTimeout(fitT); fitT=setTimeout(fitCards,250); }
addEventListener('resize', scalePage);
document.addEventListener('focusout', ()=>setTimeout(()=>{ if(!(document.activeElement&&document.activeElement.isContentEditable)){ window.scrollTo(0,0); scalePage(); } },300));

/* ---------- Board helpers ---------- */
// Keep the display awake while the Focus Wall is open (where the browser allows it)
let wakeLock=null;
async function keepAwake(){ try{ if('wakeLock' in navigator && document.visibilityState==='visible' && !wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{ wakeLock=null; }); } }catch(e){} }
document.addEventListener('visibilitychange', keepAwake);
document.addEventListener('pointerdown', keepAwake, {once:false, passive:true});
keepAwake();
// Hide the mouse/pen cursor after 3 seconds without movement
let idleT; function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(()=>document.body.classList.add('idle'),3000); lastTouch=Date.now(); }
let lastTouch=Date.now(), manualPick=0;
['pointermove','pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, wake, {passive:true}));
wake();
// No long-press context menu on the board (except while editing text)
document.addEventListener('contextmenu', e=>{ if(!(teacher && e.target.isContentEditable)) e.preventDefault(); });
document.addEventListener('fullscreenchange', ()=>setTimeout(scalePage,100));

load(); render(); tick(); scalePage();
</script>
</body>
