<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Periculum in Pompeiis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Cinzel:wght@500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: a single paperback page, 1980s branching-book style, with a Pompeian-red cover band and Roman-capital inscriptions */
:root{
  --paper:#f7f0de; --page:#fffaf0; --ink:#271c15; --muted:#6e5e50;
  --red:#9e2c1e; --ochre:#b9771f; --line:#dccdb0; --good:#2f6b3a; --bad:#a3271a;
  --shade:rgba(60,30,10,.12);
  --f-cover:"Bungee", "Arial Black", Impact, sans-serif;
  --f-latin:"Cinzel", "Trajan Pro", Georgia, serif;
  --f-body:"Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17110e; --page:#231a15; --ink:#f0e4cc; --muted:#b4a28a;
  --red:#e0654f; --ochre:#e2a54a; --line:#43352a; --good:#7fc98a; --bad:#f08070;
  --shade:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17110e; --page:#231a15; --ink:#f0e4cc; --muted:#b4a28a;
  --red:#e0654f; --ochre:#e2a54a; --line:#43352a; --good:#7fc98a; --bad:#f08070;
  --shade:rgba(0,0,0,.4); color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.book{max-width:680px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}

/* Cover */
.cover{background:var(--red);color:#fff7e8;border-radius:4px;padding:28px 24px 24px;box-shadow:0 10px 30px var(--shade);display:grid;gap:14px;position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:18px solid rgba(255,255,255,.12)}
.cover .series{font-family:var(--f-body);font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;opacity:.9}
.cover h1{font-family:var(--f-cover);font-weight:400;font-size:clamp(2rem,8vw,3.2rem);line-height:1;color:#ffe9b8}
.cover .tag{font-style:italic;font-size:1.05rem;max-width:34ch}
.cover .warn{background:#fff7e8;color:#3a1d12;padding:12px 14px;border-radius:3px;font-size:.92rem}
.cover .warn b{font-family:var(--f-latin);letter-spacing:.06em}

.card{background:var(--page);border:1px solid var(--line);border-radius:4px;padding:22px;box-shadow:0 4px 18px var(--shade)}
label{display:block;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=email]{width:100%;box-sizing:border-box;padding:11px 12px;border:1.5px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink)}
.field{display:grid;gap:2px}
.form{display:grid;gap:14px}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
.btn{appearance:none;border:2px solid var(--ink);background:var(--ink);color:var(--page);padding:11px 18px;border-radius:3px;cursor:pointer;font-weight:600}
.btn.alt{background:transparent;color:var(--ink)}
.btn:hover{transform:translateY(-1px)}
.note{font-size:.88rem;color:var(--muted)}

/* Status bar */
.status{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;font-size:.9rem}
.lamps{display:flex;gap:6px;align-items:center}
.lamp{width:26px;height:16px}
.lamp.out{opacity:.25;filter:grayscale(1)}
.stat{font-variant-numeric:tabular-nums}
.stat b{font-family:var(--f-cover);font-weight:400;color:var(--red)}

/* Page */
.page{background:var(--page);border:1px solid var(--line);border-radius:3px;padding:30px 26px 26px;box-shadow:0 6px 22px var(--shade);position:relative;display:grid;gap:18px}
.pnum{position:absolute;top:10px;right:14px;font-family:var(--f-cover);color:var(--red);font-size:1.05rem}
.page h2{font-family:var(--f-cover);font-weight:400;font-size:1.45rem;color:var(--red);padding-right:44px;line-height:1.15}
.story{display:grid;gap:12px}
.inscription{background:var(--paper);border:2px solid var(--ochre);padding:16px 14px;text-align:center;font-family:var(--f-latin);font-weight:700;letter-spacing:.08em;font-size:1.25rem;line-height:1.45}
.inscription .who{display:block;font-family:var(--f-body);font-weight:400;font-style:italic;letter-spacing:0;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.q{display:grid;gap:10px}
.q h3{font-size:1rem}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:3px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--paper));text-decoration:line-through}
.opt[disabled]{cursor:default}
.feedback{font-size:.95rem;padding:10px 12px;border-left:4px solid var(--good)}
.feedback.no{border-color:var(--bad)}
.hintrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--red);text-decoration:underline;cursor:pointer;padding:0}
.gloss{display:flex;flex-wrap:wrap;gap:6px}
.gloss span{background:var(--paper);border:1px dashed var(--ochre);padding:2px 8px;border-radius:2px;font-size:.88rem}
.gloss em{font-family:var(--f-latin);font-style:normal;font-weight:700}

.choices{display:grid;gap:12px;border-top:2px dotted var(--line);padding-top:16px}
.choices .lead{font-style:italic;color:var(--muted)}
.choice{display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;padding:14px 16px;border:2px solid var(--ink);border-radius:3px;background:var(--page);color:var(--ink);cursor:pointer}
.choice:hover{background:var(--paper)}
.choice .la{font-family:var(--f-latin);font-weight:700;letter-spacing:.04em;font-size:1.08rem;min-width:0}
.choice .turn{font-size:.8rem;white-space:nowrap;color:var(--red);font-weight:600}

.end{text-align:center;padding:10px 0;font-family:var(--f-cover);font-size:2rem;color:var(--red)}
.recap{display:grid;gap:6px;font-size:.92rem}
.recap li{margin-left:1.2em}
.recap .la{font-family:var(--f-latin);font-weight:700}

.cert{border:3px double var(--ochre);padding:18px;text-align:center;display:grid;gap:6px}
.cert .big{font-family:var(--f-latin);font-weight:700;font-size:1.3rem;letter-spacing:.06em}
.row{display:flex;flex-wrap:wrap;gap:10px}
.saved{font-size:.88rem;color:var(--muted)}

/* Teacher */
.teacher h2{font-family:var(--f-cover);font-weight:400;font-size:1.2rem;color:var(--red)}
.tablewrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.empty{padding:14px 0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.btn:hover{transform:none}}
@media (max-width:480px){.page{padding:28px 16px 18px}.choice{flex-direction:column;align-items:flex-start}}
</style>

<div class="book" id="app"></div>

<script>
/* ---------- Story data: each page has a Latin passage, a translation question, and Latin choices ---------- */
const PAGES = {
  1:{title:"Through the Mosaic",
    story:["You are a modern-day explorer, sneakers, backpack, phone and all, on a guided tour of the ruins of Pompeii, the Roman town buried by the volcano Vesuvius in AD 79. Behind a rope you spot a floor mosaic of a snarling black dog. When the guide looks away, you kneel and touch it.",
           "The floor drops away. You land hard on cool stone tiles. Sunlight. Shouting merchants. The smell of baking bread. The ruins are no longer ruins. You check your phone: NO SERVICE. The date on the screen flickers and stops at a year with only two digits: 79.",
           "You are trapped in the past, and nobody here speaks English. At your feet is the same mosaic, brand new, with words set in tiny stones. A real dog growls from a doorway."],
    latin:{who:"Set into the floor mosaic", text:"CAVE CANEM"},
    q:{prompt:"What does the mosaic say?", opts:["Welcome, friend","Beware of the dog","The dog is sleeping","Enter the cave"], a:1,
       gloss:[["cave","beware! watch out!"],["canem","dog (as the object)"]]},
    choices:[{la:"Fuge ad viam!",en:"Run to the street!",to:4},{la:"Lude cum cane.",en:"Play with the dog.",to:7}]},
  4:{title:"The Woman at the Fountain",
    story:["You sprint onto a street paved with huge stones. Stepping stones cross it so people can avoid the mud and mess.",
           "An old woman filling a jug at a fountain grabs your sleeve. She points at the tall mountain behind the town. A thin line of smoke rises from its top."],
    latin:{who:"The old woman says", text:"Salve! Ego sum Iulia. Mons iratus est. Clavem auream quaere!"},
    q:{prompt:"What does Iulia want you to do?", opts:["Close the golden door","Climb the angry mountain","Look for the golden key","Eat the golden bread"], a:2,
       gloss:[["salve","hello"],["mons","mountain"],["iratus","angry"],["clavem","key (object)"],["auream","golden"],["quaere","search for! look for!"]]},
    choices:[{la:"Ad forum ambula.",en:"Walk to the forum.",to:9},{la:"Ad thermas ambula.",en:"Walk to the baths.",to:12}]},
  7:{title:"A Good Dog",
    story:["You hold out your hand. The dog sniffs it, then wags its whole back end. It is all bark.",
           "A bronze tag hangs from its collar. The letters are worn but you can read them."],
    latin:{who:"Stamped on the bronze collar tag", text:"Canis bonus sum. Me sequere ad villam."},
    q:{prompt:"What does the tag say?", opts:["The good dog is in the house.","I am a good dog. Follow me to the house.","I am a bad dog. Run from the house.","The dog sees a village."], a:1,
       gloss:[["canis","dog"],["bonus","good"],["sum","I am"],["me","me"],["sequere","follow!"],["villam","house, villa"]]},
    choices:[{la:"Canem sequere.",en:"Follow the dog.",to:15},{la:"Canem relinque et ad viam curre.",en:"Leave the dog and run to the street.",to:4}]},
  9:{title:"The Forum",
    story:["The forum is the heart of the town: a long open square with temples, shops and a crowd of people arguing about prices.",
           "A merchant named Marcus sees you staring at the temples. He leans in and whispers, as if selling a secret."],
    latin:{who:"Marcus the merchant whispers", text:"Clavis aurea in templo Apollinis est. Sacerdos dormit."},
    q:{prompt:"Where is the golden key?", opts:["In the merchant's shop","Under the priest's bed","In the Temple of Apollo","In the forum fountain"], a:2,
       gloss:[["clavis","key"],["aurea","golden"],["in templo","in the temple"],["Apollinis","of Apollo"],["sacerdos","priest"],["dormit","is sleeping"]]},
    choices:[{la:"Templum intra.",en:"Enter the temple.",to:18},{la:"Mercatori pecuniam da.",en:"Give money to the merchant.",to:20},{la:"Ad theatrum ambula.",en:"Walk to the theater.",to:36}]},
  12:{title:"The Public Baths",
    story:["Romans went to the baths every day to wash, exercise and gossip. Inside, steam curls off the pools and voices echo off painted walls.",
           "A bath attendant with a towel over his arm blocks your way and smiles."],
    latin:{who:"The bath attendant says", text:"Aqua calida est. Intra et lava!"},
    q:{prompt:"What does the attendant say?", opts:["The water is cold. Get out!","The bath is closed today.","The water is warm. Come in and wash!","Drink the hot water."], a:2,
       gloss:[["aqua","water"],["calida","warm, hot"],["est","is"],["intra","come in! enter!"],["lava","wash!"]]},
    choices:[{la:"In aquam salta.",en:"Jump into the water.",to:13},{la:"E thermis curre.",en:"Run out of the baths.",to:9}]},
  15:{title:"The House of the Dog",
    story:["The dog trots through a doorway into a grand house. In the middle of the main hall, the atrium, a square hole in the roof lets rain fall into a pool below.",
           "The dog sits beside a heavy wooden box and barks once. Someone has painted a message on the red wall above it."],
    latin:{who:"Painted on the atrium wall", text:"In atrio est arca. In arca est clavis."},
    q:{prompt:"What does the wall say?", opts:["The atrium is a chest. The chest is a key.","There is a chest in the atrium. The key is in the chest.","The key is in the kitchen.","Open the door of the atrium."], a:1,
       gloss:[["in atrio","in the atrium (main hall)"],["est","is, there is"],["arca","chest, box"],["clavis","key"]]},
    choices:[{la:"Arcam aperi.",en:"Open the chest.",to:22},{la:"Culinam intra.",en:"Go into the kitchen.",to:25}]},
  18:{title:"The Temple of Apollo",
    story:["Columns tower over you. At the top of the steps, a priest in a white robe snores beside a bronze bowl. Something gold glints inside it.",
           "As you tiptoe closer, his eyes snap open."],
    latin:{who:"The priest says", text:"Quis es? Si Latine respondes, clavem tibi do."},
    q:{prompt:"What does the priest offer?", opts:["If you run, I will chase you.","Who are you? Leave the temple now.","If you answer in Latin, I give you the key.","Answer me, or the dog will bite."], a:2,
       gloss:[["quis","who"],["es","you are"],["si","if"],["Latine","in Latin"],["respondes","you answer"],["tibi","to you"],["do","I give"]]},
    choices:[{la:"Gratias tibi ago.",en:"Thank you.",to:22},{la:"Clavem rape et fuge!",en:"Grab the key and run!",to:28}]},
  22:{title:"The Golden Key",
    story:["The golden key is in your hand, cold and heavier than it looks. For one second, everything is quiet.",
           "Then the ground lurches. Pots crash off shelves. Dogs howl all over town. People rush into the street, pointing at the mountain."],
    latin:{who:"People shout in the street", text:"Terra tremit! Mons fumat!"},
    q:{prompt:"What are the people shouting?", opts:["The land is tired! The mountain sleeps!","The earth is shaking! The mountain is smoking!","The earth is wet! The mountain is cold!","Run to the mountain!"], a:1,
       gloss:[["terra","earth, ground"],["tremit","shakes, trembles"],["mons","mountain"],["fumat","smokes"]]},
    choices:[{la:"Ad Portam Marinam curre.",en:"Run to the Sea Gate.",to:30},{la:"Mane et montem specta.",en:"Stay and watch the mountain.",to:31}]},
  30:{title:"The Sea Gate",
    story:["You race downhill to the Porta Marina, the gate facing the sea. Carved into the old stone arch is a small keyhole you are sure nobody else has ever noticed.",
           "Words circle the keyhole, cut in neat Roman capitals."],
    latin:{who:"Carved around the keyhole", text:"CLAVEM IN PORTAM PONE ET DIC: DOMUM REDIRE VOLO"},
    q:{prompt:"What does the gate tell you to say?", opts:["I want to go to Rome.","The house is closed.","I want to return home.","I want to stay here."], a:2,
       gloss:[["clavem","key (object)"],["in portam","into the gate"],["pone","put! place!"],["dic","say!"],["domum","home, homeward"],["redire","to return"],["volo","I want"]]},
    choices:[{la:"Domum redire volo!",en:"I want to return home!",to:33},{la:"Romam ire volo!",en:"I want to go to Rome!",to:34},{la:"Clavem in mare iace!",en:"Throw the key into the sea!",to:38}]},

  /* Endings */
  13:{end:"bad",title:"Too Relaxed",story:["You leap in with a huge splash. The water is perfect. You float, then doze off in the steam.","You wake up with wrinkled fingers, slumped on a bench in the modern ruins. The tour group is gone, and so is your chance at the golden key. Was it all a dream?"]},
  20:{end:"bad",title:"A Bargain",story:["Marcus pockets your coins and hands you a shiny key with a big wink. On closer look it is wood, painted gold. CLAVIS LIGNEA, says a tiny label on the back: a wooden key.","By the time you march back to his stall, Marcus and his cart are gone."]},
  25:{end:"bad",title:"Fur! Fur!",story:["The cook turns around, sees a stranger in her kitchen and screams “Fur! Fur!” (Thief! Thief!)","She chases you out with a ladle. You hide in an empty olive-oil jar until dark, and the dog never finds you again."]},
  28:{end:"bad",title:"The Rhyming Curse",story:["You snatch the key and bolt. Behind you the priest calls on Apollo, god of music and poetry.","The key turns to dust in your hand. Worse, from now on every sentence you say comes out in rhyme. Your classmates find this very, very funny."]},
  31:{end:"bad",title:"Frozen in Place",story:["You stand and stare as the smoke grows into a towering grey column. You cannot look away.","A hot wind blows. The mosaic tile in your pocket flares and yanks you home, but the golden key slips from your fingers and stays behind in AD 79."]},
  33:{end:"best",title:"Domum Redisti",story:["You turn the key and say the words clearly. The arch fills with light.","You are kneeling by the rope in the modern ruins, the tour guide still mid-sentence. Your phone buzzes back to life. In your pocket: a small golden key. Scratched into the stone beside the dog mosaic, where it was not before, is one word: OPTIME! (Excellent!)"]},
  34:{end:"good",title:"Civis Romanus",story:["The arch glows, but instead of your own time you land in the bustling city of Rome itself, safely far from Vesuvius. Your phone battery dies for good.","You use your modern knowledge to open a school, and Romans travel far to meet the strange explorer who knows about germs and pizza. You chose Rome over home."]},
  36:{end:"bad",title:"The Star of the Show",story:["You wander into the open-air theater just as a play begins. An actor shoves a mask into your hands and pushes you onstage. He thinks you are the new actor!","The crowd roars with laughter at your sneakers. You are such a hit that the troupe will not let you leave. You tour Italy for years, but you never find the golden key."]},
  38:{end:"bad",title:"Splash",story:["You hurl the golden key as far as you can. It flashes in the sun and sinks beneath the waves.","The keyhole in the arch fades into plain stone. Somewhere, a dolphin is now holding the only way back to your own time."]},
  0:{end:"bad",title:"Lucerna Exstincta",story:["Your last oil lamp flickers and goes out. In the dark, you cannot read the Latin anymore.","The ground tilts, and you tumble back through the mosaic into the modern ruins, empty-handed. The adventure is over, for now."]}
};
const ENDING_IDS=[33,34,13,20,25,28,31,36,38,0];
const BONUS={best:30,good:20,bad:0};
const MAX_LAMPS=3, MAX_HINTS=3;


/* ---------- State ---------- */
let S = {screen:"cover", name:"", email:"", page:1, lamps:MAX_LAMPS, score:0, correct:0, answered:0, hints:0,
         path:[], answered_here:null, hint_open:false, saved:null};
let db=null, user=null, uid=null, canTeach=false, roster=null, rosterOpen=false;
const $ = s=>document.querySelector(s);
const esc = t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function lampSVG(on){return `<svg class="lamp ${on?"":"out"}" viewBox="0 0 26 16" aria-hidden="true"><path d="M2 10c0-3 5-5 11-5s9 2 11 4l-5 1c-1 3-4 5-8 5S3 13 2 10z" fill="var(--ochre)"/><path d="M22 2c1 2 2 4 0 6" stroke="${on?"var(--red)":"var(--muted)"}" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`}

/* ---------- Render ---------- */
function render(){
  const app=$("#app");
  if(S.screen==="cover") app.innerHTML=coverHTML()+teacherHTML();
  else if(S.screen==="play") app.innerHTML=statusHTML()+pageHTML();
  bind();
}

function coverHTML(){
  return `<section class="cover">
    <div class="series">A Latin Adventure Book · Grades 6–8</div>
    <h1>Periculum in Pompeiis</h1>
    <p class="tag">You are a modern explorer, trapped in AD 79. Translate the Latin to find your way home.</p>
    <div class="warn"><b>CAVE!</b> Do not read this book straight through. Each page ends with choices written in Latin. Translate carefully, choose wisely, and turn to the page you pick. There are 10 endings. Only one gets you back to your own time with the golden key.</div>
  </section>
  <section class="card">
    <form class="form" id="signin" novalidate>
      <div class="field"><label for="nm">Your name</label><input type="text" id="nm" autocomplete="name" value="${esc(S.name)}" placeholder="First and last name"></div>
      <div class="field"><label for="em">Your email</label><input type="email" id="em" autocomplete="email" value="${esc(S.email)}" placeholder="name@school.org"></div>
      <div class="err" id="err" role="alert"></div>
      <div class="row"><button class="btn" type="submit">Open the book</button></div>
      <p class="note">You start with ${MAX_LAMPS} oil lamps. Each wrong translation blows one out. You also get ${MAX_HINTS} word hints per game. At the end, screenshot your certificate and turn it in to your teacher.</p>
    </form>
  </section>`;
}

function statusHTML(){
  let l="";for(let i=0;i<MAX_LAMPS;i++)l+=lampSVG(i<S.lamps);
  return `<div class="status" aria-live="polite">
    <div class="lamps" aria-label="${S.lamps} lamps left">${l}</div>
    <div class="stat">Score <b>${S.score}</b></div>
    <div class="stat">Translations ${S.correct}/${S.answered}</div>
    <div class="stat">Hints left ${MAX_HINTS-S.hints}</div>
  </div>`;
}

function pageHTML(){
  const id=S.page, P=PAGES[id];
  const head=`<span class="pnum">${id===0?"—":id}</span><h2>${esc(P.title)}</h2>`;
  if(P.end) return endHTML(id,P,head);
  const done=S.answered_here;
  let opts=P.q.opts.map((o,i)=>{
    let cls="opt";
    if(done){ if(i===P.q.a) cls+=" right"; else if(i===done.pick) cls+=" wrong"; }
    return `<button class="${cls}" data-opt="${i}" ${done?"disabled":""}>${esc(o)}</button>`}).join("");
  const glossShown = S.hint_open || done;
  const gloss = glossShown?`<div class="gloss">${P.q.gloss.map(([w,m])=>`<span><em>${esc(w)}</em> = ${esc(m)}</span>`).join("")}</div>`:"";
  const hintBtn = (!done && !S.hint_open)? (S.hints<MAX_HINTS?`<button class="linkbtn" id="hint">Use a hint: show the word list (−3 points)</button>`:`<span class="note">No hints left.</span>`):"";
  const fb = done?`<p class="feedback ${done.ok?"":"no"}">${done.ok?"<b>Recte!</b> Correct. +10 points.":`<b>Non recte.</b> The answer is “${esc(P.q.opts[P.q.a])}.” You lose a lamp.`}</p>`:"";
  const choices = done && S.lamps>0 ? `<div class="choices"><p class="lead">What do you do? The choices are in Latin.</p>${P.choices.map(c=>`<button class="choice" data-to="${c.to}"><span class="la">${esc(c.la)}</span><span class="turn">Turn to page ${c.to} →</span></button>`).join("")}</div>`
     : (done && S.lamps<=0 ? `<div class="choices"><button class="choice" data-to="0"><span class="la">Lucerna exstincta…</span><span class="turn">Turn the page →</span></button></div>`:"");
  return `<article class="page">${head}
    <div class="story">${P.story.map(t=>`<p>${esc(t)}</p>`).join("")}</div>
    <div class="inscription"><span class="who">${esc(P.latin.who)}</span>${esc(P.latin.text)}</div>
    <div class="q"><h3>${esc(P.q.prompt)}</h3><div class="hintrow">${hintBtn}</div>${gloss}<div class="opts">${opts}</div>${fb}</div>
    ${choices}
  </article>`;
}

function endHTML(id,P,head){
  const kind=P.end, found=new Set((S.saved&&S.saved.endingsFound)||[]); found.add(id);
  const recap=S.path.filter(s=>s.la).map(s=>`<li><span class="la">${esc(s.la)}</span> means “${esc(s.en)}”</li>`).join("");
  const label={best:"THE END",good:"THE END",bad:"THE END"}[kind];
  const msg={best:"You found the best ending!",good:"A happy ending, but you never got home.",bad:"Not the best ending. Try a different path."}[kind];
  const date=new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
  return `<article class="page">${head}
    <div class="story">${P.story.map(t=>`<p>${esc(t)}</p>`).join("")}</div>
    <div class="end">${label}</div>
    <p style="text-align:center"><b>${msg}</b> Ending ${ENDING_IDS.indexOf(id)+1} of 10.</p>
    ${recap?`<div class="recap"><b>Your choices, translated:</b><ul>${recap}</ul></div>`:""}
    <div class="cert">
      <div class="note">Certificate of Translation</div>
      <div class="big">${esc(S.name)}</div>
      <div class="note">${esc(S.email)}</div>
      <div>Ending: <b>${esc(P.title)}</b> · Score <b>${S.score}</b> · Translations ${S.correct}/${S.answered} · Hints ${S.hints}</div>
      <div class="note">${date} · Endings found: ${found.size}/10</div>
    </div>
    <p class="saved" id="savemsg">${saveMsg()}</p>
    <div class="row"><button class="btn" id="again">Start a new adventure</button><button class="btn alt" id="home">Back to cover</button></div>
  </article>`;
}
function saveMsg(){
  if(S.saveState==="ok") return "Saved. Your teacher can see this result.";
  if(S.saveState==="saving") return "Saving your result…";
  if(S.saveState==="fail") return "This result could not be saved to your teacher’s list. Take a screenshot of the certificate and turn it in.";
  return "";
}

function teacherHTML(){
  if(!canTeach) return "";
  let body="";
  if(rosterOpen){
    if(!roster) body=`<p class="empty">Loading…</p>`;
    else if(!roster.length) body=`<p class="empty">No students yet. Results appear here as students finish an ending.</p>`;
    else body=`<div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Games</th><th>Best score</th><th>Endings</th><th>Got home</th><th>Last played</th></tr></thead><tbody>${
      roster.map(r=>`<tr><td>${esc(r.name||"")}</td><td>${esc(r.email||"")}</td><td>${(r.runs||[]).length}</td><td>${r.bestScore??0}</td><td>${(r.endingsFound||[]).length}/10</td><td>${(r.endingsFound||[]).includes(33)?"Yes":"No"}</td><td>${r.updatedAt?new Date(r.updatedAt).toLocaleString():""}</td></tr>`).join("")}</tbody></table></div>
      <div class="row" style="margin-top:12px"><button class="btn alt" id="csv">Copy as spreadsheet (CSV)</button><span class="note" id="csvmsg"></span></div>`;
  }
  return `<section class="card teacher"><h2>Teacher roster</h2>
    <p class="note">Only you and editors see this list. Students see the game only.</p>
    <div class="row" style="margin-top:10px"><button class="btn alt" id="roster">${rosterOpen?"Hide roster":"Show student results"}</button></div>${body}</section>`;
}

/* ---------- Events ---------- */
function bind(){
  const f=$("#signin"); if(f) f.addEventListener("submit",e=>{e.preventDefault();
    const n=$("#nm").value.trim(), m=$("#em").value.trim();
    if(n.length<2){$("#err").textContent="Type your name so your teacher knows who played.";$("#nm").focus();return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){$("#err").textContent="That email doesn’t look complete. Check for the @ and the part after it.";$("#em").focus();return}
    S.name=n;S.email=m;try{localStorage.setItem("pip_id",JSON.stringify({n,m}))}catch(_){}
    newGame(); registerPlayer();
  });
  document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>answer(+b.dataset.opt));
  document.querySelectorAll("[data-to]").forEach(b=>b.onclick=()=>go(+b.dataset.to));
  const h=$("#hint"); if(h) h.onclick=()=>{S.hints++;S.score=Math.max(0,S.score-3);S.hint_open=true;render()};
  const a=$("#again"); if(a) a.onclick=()=>{newGame()};
  const ho=$("#home"); if(ho) ho.onclick=()=>{S.screen="cover";render()};
  const r=$("#roster"); if(r) r.onclick=()=>{rosterOpen=!rosterOpen;if(rosterOpen)loadRoster();render()};
  const c=$("#csv"); if(c) c.onclick=copyCSV;
}
function newGame(){
  Object.assign(S,{screen:"play",page:1,lamps:MAX_LAMPS,score:0,correct:0,answered:0,hints:0,path:[{page:1}],answered_here:null,hint_open:false,saveState:null});
  render(); window.scrollTo({top:0});
}
function answer(i){
  const P=PAGES[S.page]; const ok=i===P.q.a;
  S.answered++; if(ok){S.correct++;S.score+=10}else{S.lamps--}
  S.answered_here={pick:i,ok}; render();
}
function go(to){
  const P=PAGES[S.page]; const c=(P.choices||[]).find(x=>x.to===to);
  if(c) S.path[S.path.length-1]={page:S.page,la:c.la,en:c.en};
  S.page=to; S.path.push({page:to}); S.answered_here=null; S.hint_open=false;
  if(PAGES[to].end){S.score+=BONUS[PAGES[to].end]; saveRun(to)}
  render(); window.scrollTo({top:0});
}

/* ---------- Saving to the class roster ---------- */
async function registerPlayer(){
  if(!db||!uid) return;
  try{
    const ref=db.doc("players/"+uid); const snap=await ref.get(); const d=snap.exists?snap.data():null;
    S.saved=d||{runs:[],endingsFound:[],bestScore:0};
    await ref.set({...S.saved,name:S.name,email:S.email,updatedAt:Date.now()});
  }catch(e){}
}
async function saveRun(endId){
  if(!db||!uid){S.saveState=null;return}
  S.saveState="saving";
  try{
    const ref=db.doc("players/"+uid); const snap=await ref.get(); const d=(snap.exists&&snap.data())||{runs:[],endingsFound:[],bestScore:0};
    const runs=(d.runs||[]).concat([{at:Date.now(),ending:endId,endingTitle:PAGES[endId].title,score:S.score,correct:S.correct,answered:S.answered,hints:S.hints,path:S.path.map(p=>p.page)}]).slice(-50);
    const endingsFound=[...new Set([...(d.endingsFound||[]),endId])];
    const rec={name:S.name,email:S.email,runs,endingsFound,bestScore:Math.max(d.bestScore||0,S.score),updatedAt:Date.now()};
    await ref.set(rec); S.saved=rec; S.saveState="ok";
  }catch(e){S.saveState="fail"}
  const el=$("#savemsg"); if(el) el.textContent=saveMsg(); else render();
}
let rosterUnsub=null;
function loadRoster(){
  if(!db||rosterUnsub) return;
  rosterUnsub=db.collection("players").onSnapshot(q=>{
    roster=q.docs.map(d=>d.data()).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
    if(S.screen==="cover") render();
  },()=>{roster=[];if(S.screen==="cover")render()});
}
function copyCSV(){
  const rows=[["Name","Email","Games played","Best score","Endings found","Got home","Last played"]].concat((roster||[]).map(r=>[r.name,r.email,(r.runs||[]).length,r.bestScore??0,(r.endingsFound||[]).length,(r.endingsFound||[]).includes(33)?"Yes":"No",r.updatedAt?new Date(r.updatedAt).toLocaleString():""]));
  const csv=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const msg=$("#csvmsg");
  navigator.clipboard.writeText(csv).then(()=>msg.textContent="Copied. Paste into a spreadsheet.").catch(()=>{msg.textContent="Copy blocked here. Select the table and copy it instead."});
}

/* ---------- Boot ---------- */
function start(data){
  try{const id=JSON.parse(localStorage.getItem("pip_id")||"null");if(id){S.name=id.n;S.email=id.m}}catch(_){}
  if(data&&data.S) S=data.S;
  render();
  (async()=>{
    try{
      user=await window.claude?.use?.("user");
      db=await window.claude?.use?.("db");
      if(user){ canTeach=!!(user.isOwner()||user.canEdit()); try{uid=await user.id()}catch(_){} }
      if(S.screen==="cover") render();
    }catch(_){}
  })();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
